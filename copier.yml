---
_subdirectory: template

author_name:
  type: str
  help: Author name
  default: "Your Name"

author_email:
  type: str
  help: Author email
  default: "your.email@example.com"

method_name:
  type: str
  help: What is the name of your simulation method (e.g., "DG", "DE", "pyroomacoustics")?
  placeholder: "MySimMethod"

method_name_lower:
  type: str
  help: What is the lowercase (snake_case) version of your method name (used for package naming)?
  default: "{{ method_name.lower() }}"

method_description:
  type: str
  help: Brief description of your simulation method
  placeholder: "Python package for acoustic simulation using {{ method_name }}."

method_keywords:
  type: str
  help: Comma-separated keywords for your method
  default: "acoustic simulation, geometrical acoustics"

method_class_name:
  type: str
  help: Name of the main method class (e.g., "DGMethod", "DEMethod")
  default: "{{ method_name }}Method"

python_version_min:
  type: str
  help: Minimum Python version required (e.g., "3.11")
  default: "3.11"

python_version_max:
  type: str
  help: Maximum Python version (leave empty for no upper limit, or use "3.14")
  default: ""

additional_dependencies:
  type: str
  help: Additional dependencies (comma-separated, e.g., "numpy>=1.23.0,pandas>=2.2.0")
  default: "numpy>=1.23.0"

license:
    type: str
    help: |
        Which license do you want to use? Includes a LICENSE file in the repository root.
        For more information, see:
        - https://opensource.org/licenses
        - https://www.pyopensci.org/python-package-guide/documentation/repository-files/license-files.html
    choices:
        "Permissive - MIT": "MIT"
        "Permissive - BSD-3-Clause": "BSD-3-Clause"
        "Permissive - Apache-2.0": "Apache-2.0"
        "Copyleft - GPL-3.0": "GPL-3.0-only"
        "Copyleft - EUPL-1.2": "EUPL-1.2"
        "Intermediate - MPL-2.0": "MPL-2.0"
        "Other": ""
    default: MIT

copyright_statement:
    type: str
    help: "What is the copyright statement? For example publication year, copyright holder."
    default: "{{ '%Y' | strftime }}, {{ author }}"
